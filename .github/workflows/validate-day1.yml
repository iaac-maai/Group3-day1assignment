name: Validate Day 1 notebook
on:
  push:
    branches: [main, fix/day1-cleanup]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install from UTF-8 requirements in a fresh environment
        run: |
          python -m pip install -r requirements.txt
          python -m pip install nbclient==0.10.2 nbformat==5.10.4 ipykernel==6.29.5
          python -m pip check
      - name: Execute every cell in a fresh Jupyter kernel
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat
          from nbclient import NotebookClient
          p = Path('notebook/final_analysis.ipynb')
          nb = nbformat.read(p, as_version=4)
          for cell in nb.cells:
              if cell.cell_type == 'code':
                  cell.outputs = []
                  cell.execution_count = None
          NotebookClient(nb, timeout=180, kernel_name='python3', resources={'metadata': {'path': str(p.parent.resolve())}}).execute()
          nbformat.write(nb, p)
          cells = [c for c in nb.cells if c.cell_type == 'code']
          assert [c.execution_count for c in cells] == list(range(1, len(cells) + 1))
          assert len(list(Path('figures').glob('*.png'))) >= 4
          import pandas as pd
          assert len(pd.read_csv('data/mumbai_rentals_cleaned.csv')) == 18846
          print(f'PASS: {len(cells)} cells, exported CSV and figures.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: day1-executed
          path: |
            notebook/final_analysis.ipynb
            data/mumbai_rentals_cleaned.csv
            figures/*.png
